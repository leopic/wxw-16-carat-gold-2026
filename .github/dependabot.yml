version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    # Few open PRs at a time, an unmerged pile is what paused Dependabot before
    open-pull-requests-limit: 3
    # Skip releases younger than a week, compromised packages are usually pulled by then
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    ignore:
      # Majors follow the Node version in .nvmrc, bump them together by hand
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint peers typescript <6.1.0, drop once it supports newer versions
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      # v6 ERESOLVEs on npm 11 (optional peer chain pulls @babel/core 8), drop once that resolves
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=6.0.0"]
    groups:
      # Minor and patch bumps land as one PR, majors stay separate so CI failures are easy to pin down
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ["*"]
